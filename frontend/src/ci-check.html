<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI Check</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --accent: #22d3ee;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 30% 20%,
            rgba(34, 211, 238, 0.08),
            transparent 25%
          ),
          radial-gradient(
            circle at 70% 60%,
            rgba(94, 234, 212, 0.08),
            transparent 30%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          "Space Grotesk",
          "DM Sans",
          "Neue Haas Grotesk",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .card {
        width: min(420px, 92vw);
        padding: 28px 32px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          0 1px 0 rgba(255, 255, 255, 0.06) inset;
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34, 211, 238, 0.15);
        color: var(--fg);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>Pipeline sanity page</h1>
      <p>
        If you see this in the deployed build, CI/CD made it here just fine.
      </p>
      <div class="pill">
        <span class="dot"></span>
        <span>Ready for removal</span>
      </div>
    </main>
  </body>
</html>
