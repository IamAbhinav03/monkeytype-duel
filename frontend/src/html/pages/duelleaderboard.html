<div
  class="page pageDuelleaderboard hidden full-width content-grid"
  id="pageDuelleaderboard"
>
  <div class="content">
    <div class="bigtitle">
      <div class="text">Keyboard Duel</div>
    </div>
    <div class="divider"></div>

    <div class="timer">
      Time left:
      <span id="duelTimeLeft">30</span>
      seconds
    </div>

    <div class="duelLeaderboard">
      <div class="player" id="duelPlayer1">
        <div class="name">Player 1</div>
        <div class="wpm">0 WPM</div>

      <div class="leaderArrow" id="duelLeaderArrow">▲</div>

      <div class="player" id="duelPlayer2">
        <div class="name">Player 2</div>
        <div class="wpm">0 WPM</div>
      </div>
    </div>
  </div>
</div>
