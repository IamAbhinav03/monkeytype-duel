name: Deploy with Docker Compose

# This is so that reviewers can view before merging PRs (dev) and promote to prod on close
on:
  pull_request:
    branches: ["dev"]
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    branches: ["prod-internal"]
    types:
      - closed

jobs:
  deploy-dev:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: [self-hosted, dev-rbh-amay]

    steps:
      - name: Ensure workspace writable
        run: |
          sudo -n chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" 2>/dev/null || true
          chmod -R u+rw "$GITHUB_WORKSPACE" || true
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            git -C "$GITHUB_WORKSPACE" clean -fdx || true
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy to dev
        run: |
          docker compose -f docker/docker-compose.yml up -d --build

  deploy-prod:
    if: github.event.pull_request.base.ref == 'prod-internal'
    runs-on: [self-hosted, prod-rbh-duel]

    steps:
      - name: Ensure workspace writable
        run: |
          sudo -n chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" 2>/dev/null || true
          chmod -R u+rw "$GITHUB_WORKSPACE" || true
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            git -C "$GITHUB_WORKSPACE" clean -fdx || true
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy to prod
        run: |
          docker compose -f docker/docker-compose.yml up -d --build
