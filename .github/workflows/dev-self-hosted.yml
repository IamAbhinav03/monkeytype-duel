name: Deploy with Docker Compose

# This is so that reviewers can view before merging PRs
on:
  pull_request:
    branches: ["dev"]
    types:
      - opened
      - synchronize
      - reopened

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose -f docker/docker-compose.yml up -d --build
