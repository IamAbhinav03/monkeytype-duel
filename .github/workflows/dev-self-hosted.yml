name: Deploy with Docker Compose

# This is so that reviewers can view before merging PRs (dev) and promote to prod on close
on:
  pull_request:
    branches: ["dev"]
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    branches: ["prod-internal"]
    types:
      - closed

jobs:
  deploy-dev:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: [self-hosted, dev-rbh-amay]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev
        run: |
          docker compose -f docker/docker-compose.yml up -d --build

  deploy-prod:
    if: github.event.pull_request.base.ref == 'prod-internal'
    runs-on: [self-hosted, prod-rbh-duel] # Update the label in runner settings to prod-rbh-duel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On PR close the refs/pull/* merge ref may be gone; deploy from the target branch itself
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Deploy to prod
        run: |
          docker compose -f docker/docker-compose.yml up -d --build
