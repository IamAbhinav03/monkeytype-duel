version: "3.8"

services:
  user-handler:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MODE=dev
      - USER_HANDLER_VERSION=1.0.0
      - LOG_LEVEL=info
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    restart: unless-stopped
