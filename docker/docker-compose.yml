version: "3.8"

services:
  monkeytype-frontend:
    container_name: monkeytype-frontend
    image: monkeytype-frontend:local
    build:
      context: ..
      dockerfile: ./docker/frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: on-failure
    depends_on:
      monkeytype-backend:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: true
    environment:
      - FIREBASE_APIKEY=${FIREBASE_APIKEY:-}
      - FIREBASE_AUTHDOMAIN=${FIREBASE_AUTHDOMAIN:-}
      - FIREBASE_PROJECTID=${FIREBASE_PROJECTID:-}
      - FIREBASE_STORAGEBUCKET=${FIREBASE_STORAGEBUCKET:-}
      - FIREBASE_MESSAGINGSENDERID=${FIREBASE_MESSAGINGSENDERID:-}
      - FIREBASE_APPID=${FIREBASE_APPID:-}
      - MONKEYTYPE_BACKENDURL=${MONKEYTYPE_BACKENDURL}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - FORCE_TRIBE=true
      - FORCE_DUEL=true

  monkeytype-tribes-server:
    container_name: monkeytype-tribes-server
    image: monkeytype-tribes-server:local
    build:
      context: ..
      dockerfile: ./docker/tribes-server/Dockerfile
    ports:
      - "${TRIBES_PORT:-3005}:3005"
    restart: on-failure
    environment:
      - PORT=3005
      - MODE=prod
      - TRIBES_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "3005"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  monkeytype-backend:
    container_name: monkeytype-backend
    image: monkeytype-backend:local
    build:
      context: ..
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-5005}:5005"
    restart: on-failure
    environment:
      - DB_NAME=monkeytype
      - DB_URI=mongodb://monkeytype-mongodb:27017
      - REDIS_URI=redis://monkeytype-redis:6379
      - FRONTEND_URL=${MONKEYTYPE_FRONTENDURL}
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      #uncomment to enable the account system, check the SELF_HOSTING.md file
      #- type: bind
      #  source: ./serviceAccountKey.json
      #  target: /app/backend/src/credentials/serviceAccountKey.json
      #  read_only: true
      - type: bind
        source: ./backend-configuration.json
        target: /app/backend/dist/backend-configuration.json
        read_only: true
    depends_on:
      monkeytype-redis:
        condition: service_healthy
      monkeytype-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "5005"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  monkeytype-redis:
    container_name: monkeytype-redis
    image: redis:6.2.6
    #uncomment if you want to expose the redis server
    #ports:
    #  - "${REDIS_PORT:-6379}:6379"
    restart: on-failure
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  monkeytype-mongodb:
    container_name: monkeytype-mongodb
    image: mongo:5.0.13
    restart: on-failure
    volumes:
      - mongo-data:/data/db
    #uncomment if you want to expose the mongodb server
    #ports:
    #  - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.stats().ok' | mongo localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  monkeytype-tribes-server:
    container_name: monkeytype-tribes-server
    build:
      context: ..
      dockerfile: ./docker/tribes-server/Dockerfile
    ports:
      - "${TRIBES_PORT:-3005}:3005"
    restart: on-failure
    environment:
      - PORT=3005
      - MODE=dev
      - TRIBES_VERSION=dev
      - DB_URI=mongodb://monkeytype-mongodb:27017/monkeytype
    depends_on:
      monkeytype-mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    name: monkeytype_mongo_data
  redis-data:
    name: monkeytype_redis_data
